name: Build and Push Apptainer Containers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APPTAINER_VERSION: '1.4.5'
  APPTAINER_URL: https://github.com/apptainer/apptainer/releases/download
  YQ_VERSION: '4.53.2'
  YQ_URL: https://github.com/mikefarah/yq/releases/download

jobs:
  build-and-push:
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Set Debian Architecture Environment Variable
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "DEB_ARCH=arm64" >> $GITHUB_ENV
          else
            echo "DEB_ARCH=amd64" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          lfs: true

      - name: Set up Apptainer
        run: |
          APPTAINER_DEB="apptainer_${{ env.APPTAINER_VERSION }}-${{ env.DEB_ARCH }}.deb"
          wget -q "${{ env.APPTAINER_URL }}/v${{ env.APPTAINER_VERSION }}/${APPTAINER_DEB}"
          sudo apt-get install -y "./${APPTAINER_DEB}"
          rm -f "./${APPTAINER_DEB}"

      - name: setup oras
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: '1.3.1'

      - name: Login to GHCR for ORAS
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Setup yq
        run: |
          sudo wget -q ${{ env.YQ_URL }}/v${{ env.YQ_VERSION }}/yq_linux_${{ env.DEB_ARCH }} -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Login to GitHub Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up disk space
        run: |
          sudo rm -rf /opt/az
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/google
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift

          sudo apt clean || true
          sudo rm -rf /var/lib/apt/lists/*

          sudo docker system prune -af --volumes || true
          df -h

      - name: Prepare /mnt for use
        run: sudo chown $USER:$USER /mnt

      - name: Build and push images from manifest
        run: |
          set -e
          images_count=$(yq '.images | length' manifest.yml)

          for i in $(seq 0 $((images_count - 1))); do
            name=$(yq -r .images[$i].name manifest.yml)
            path=$(yq -r .images[$i].path manifest.yml)
            registry=$(echo "ghcr.io/${{ github.repository }}/${name}" | tr '[:upper:]' '[:lower:]')
            tag=$(yq -r .images[$i].tag manifest.yml)

            # Read the build_arm property (defaults to "null" if missing)
            build_arm=$(yq -r .images[$i].build_arm manifest.yml)

            # Skip ARM compilation entirely if the flag is missing or not true
            if [ "${{ matrix.arch }}" = "arm64" ] && [ "$build_arm" != "true" ]; then
              echo "Skipping $name for arm64 because build_arm is not set to true."
              continue
            fi

            # Dynamically determine the architecture suffix string
            if [ "$build_arm" = "true" ]; then
              arch_suffix=".${{ matrix.arch }}"
            else
              arch_suffix=""
            fi

            # Apply the suffix dynamically to the files and registry tags
            sif_file="${name}-${tag}${arch_suffix}.sif"
            oras_image_with_tag="${registry}:${tag}${arch_suffix}"
            oras_uri="${oras_image_with_tag}"

            # Check if the image/tag exists remotely.
            if oras manifest fetch "$oras_image_with_tag" > /dev/null 2>&1; then
              echo "Image $oras_image_with_tag already exists in registry, skipping build and push."
              continue
            else
              echo "Image $oras_image_with_tag does not exist in registry, proceeding with build."
            fi

            echo "Building SIF image: $sif_file from $path"
            apptainer build --disable-cache --bind $(pwd):/mnt --force "/mnt/${sif_file}" "$path"

            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "Skipping push for pull request."
              continue
            fi

            cd /mnt
            oras push "$oras_uri" --artifact-type "application/vnd.sylabs.sif.layer.v1.sif" "${sif_file}:application/vnd.sylabs.sif.layer.v1.sif"
            rm -f "${sif_file}"
            cd -
          done
